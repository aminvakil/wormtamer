services:
  wormtamer:
    image: ghcr.io/aminvakil/wormtamer:latest
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "8080:8080"
    volumes:
      - ./config.json:/etc/wormtamer/config.json:ro
      - wormtamer-data:/var/lib/wormtamer
      - wormtamer-workspaces:/var/lib/wormtamer-reviews

volumes:
  wormtamer-data:
  wormtamer-workspaces:
